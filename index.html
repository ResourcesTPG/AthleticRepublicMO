const map=L.map('map',{zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors | Tiles: OSM France'}).addTo(map);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mkIcon(color,size,border,bw=3){return L.divIcon({className:'',html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:${bw}px solid ${border};box-shadow:0 1px 5px rgba(0,0,0,.55)"></div>`,iconSize:[size+6,size+6],iconAnchor:[(size+6)/2,(size+6)/2]})}

const otherIcon=mkIcon('#fff',14,'#111',2);

});
